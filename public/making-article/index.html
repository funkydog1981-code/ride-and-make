<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>道具とものづくりの記事｜走って、つくって。</title>
  <meta name="description" content="道具を使って試し、自分に合うものをつくる記録。">
  <style>
    :root { --ink:#20332f; --muted:#64716b; --paper:#faf9f4; --green:#315c48; --line:#dcded4; }
    * { box-sizing:border-box; }
    [hidden] { display:none!important; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif; line-height:1.95; }
    a { color:inherit; text-underline-offset:4px; }
    a:focus-visible { outline:3px solid #bf9733; outline-offset:5px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:24px; padding:20px 5%; border-bottom:1px solid var(--line); }
    .brand { text-decoration:none; font-weight:800; font-size:22px; letter-spacing:.06em; }
    .brand small { display:block; font-size:10px; line-height:1.5; letter-spacing:.2em; color:var(--muted); }
    nav { display:flex; flex-wrap:wrap; gap:12px 26px; font-size:12px; }
    nav a { text-decoration:none; }
    main { max-width:1000px; margin:auto; padding:40px 28px 80px; }
    article { min-width:0; overflow-wrap:anywhere; }
    .hero { margin:0 0 45px; }
    .hero img { display:block; width:100%; height:auto; object-fit:contain; }
    figcaption { color:var(--muted); font-size:11px; padding-top:9px; white-space:pre-line; }
    .article-heading,.summary,.production,.body,.back { max-width:820px; margin-left:auto; margin-right:auto; }
    .eyebrow { font-size:11px; letter-spacing:.16em; color:var(--green); }
    h1,h2 { font-family:'Yu Mincho','Hiragino Mincho ProN',serif; font-weight:500; line-height:1.6; }
    h1 { font-size:clamp(30px,4.5vw,52px); letter-spacing:.04em; margin:12px 0 20px; white-space:pre-line; }
    .date { font-size:12px; color:var(--muted); margin:0 0 28px; }
    .summary { color:#4d5e55; font-size:15px; white-space:pre-line; margin-bottom:40px; }
    .lead-read { display:none; }
    /* PCは旅記事と同様に、写真の上へタイトル・概要を重ねる。 */
    @media(min-width:801px) {
      main { max-width:none; padding:0 0 80px; }
      .production,.body,.back { width:calc(100% - 56px); }
      .article-lead { margin-bottom:48px; }
      .lead-copy { max-width:820px; margin:auto; padding:40px 0 0; width:calc(100% - 56px); }
      .article-lead:has(.hero:not([hidden])) { position:relative; min-height:max(560px,min(780px,83vh)); background:#3c675d; color:white; }
      .article-lead:has(.hero:not([hidden])) .hero { position:absolute; inset:0; margin:0; }
      .article-lead:has(.hero:not([hidden])) .hero img { width:100%; height:100%; object-fit:cover; object-position:center; }
      .article-lead:has(.hero:not([hidden])) .hero::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg,rgba(4,29,29,.72),rgba(4,29,29,.08) 85%),linear-gradient(0deg,rgba(5,30,30,.45),transparent 65%); }
      .article-lead:has(.hero:not([hidden])) .lead-copy { position:relative; z-index:1; margin:0; width:auto; max-width:960px; padding:65px 7vw 38px; }
      .article-lead:has(.hero:not([hidden])) h1 { font-size:clamp(40px,5.5vw,76px); line-height:1.38; letter-spacing:.08em; }
      .article-lead:has(.hero:not([hidden])) .summary { color:white; font-size:14px; line-height:2.1; margin-bottom:28px; }
      .article-lead:has(.hero:not([hidden])) .eyebrow,.article-lead:has(.hero:not([hidden])) .date { color:white; }
      .article-lead:has(.hero:not([hidden])) figcaption { position:absolute; right:3%; bottom:12px; z-index:2; max-width:25%; color:white; text-shadow:0 1px 4px #000; }
      .lead-read { display:inline-block; font-size:12px; margin-bottom:12px; }
    }
    .production { border-block:1px solid var(--line); padding:24px 0; margin-bottom:48px; }
    .production h2 { font-size:25px; margin:0 0 20px; }
    dl { margin:0; display:grid; grid-template-columns:minmax(100px,1fr) minmax(0,3fr); gap:12px 24px; }
    dt { color:var(--muted); font-size:12px; }
    dd { margin:0; font-size:14px; white-space:pre-line; }
    .body { font-size:15px; }
    .body h2 { font-size:30px; margin:48px 0 22px; }
    .body h3 { font-size:20px; margin-top:32px; }
    .body p { margin:0 0 24px; }
    .body img { display:block; max-width:100%; height:auto; object-fit:contain; margin:28px auto; }
    .body figure { margin:30px 0; }
    .body video { display:block; width:100%; max-width:100%; height:auto; margin:30px 0; background:#172a24; }
    .body iframe { display:block; width:100%; height:auto; aspect-ratio:16/9; border:0; margin:30px 0; }
    .table-scroll { max-width:100%; overflow-x:auto; margin:28px 0; }
    table { border-collapse:collapse; width:100%; font-size:13px; }
    th,td { border-bottom:1px solid var(--line); padding:13px 12px; text-align:left; vertical-align:top; }
    th { color:var(--muted); border-bottom:2px solid var(--ink); }
    blockquote { margin:28px 0; padding:20px 24px; background:#eeefe5; border-left:3px solid #8a9b65; }
    pre { overflow-x:auto; padding:20px; background:#eeefe5; }
    code { overflow-wrap:anywhere; }
    .plain-text { white-space:pre-wrap; }
    .message { padding:24px; background:#eeefe5; }
    .back { margin-top:50px; font-size:13px; }
    footer { padding:25px 5%; border-top:1px solid var(--line); font-size:11px; color:var(--muted); }
    @media(max-width:650px) {
      header { flex-direction:column; align-items:flex-start; padding:18px 22px; gap:14px; }
      .brand { font-size:20px; }
      nav { font-size:11px; gap:10px 18px; }
      main { padding:28px 22px 55px; }
      .hero { margin-bottom:28px; }
      .body h2 { font-size:25px; }
      .body .table-scroll th,.body .table-scroll td { min-width:8rem; }
      dl { grid-template-columns:1fr; gap:4px; }
      dd { margin-bottom:14px; }
    }

/* フッター項目の追加時も折り返せるようにする */
footer,.footer-links { flex-wrap:wrap; }

/* チャンネルリンクを追加しても既存ナビゲーションを折り返す。 */
header nav { flex-wrap:wrap; }
header nav a { white-space:nowrap; }
#article-body iframe[src*="youtube.com/embed/"], #article-body iframe[src*="youtube-nocookie.com/embed/"] { width:100%; height:auto; aspect-ratio:16/9; border:0; }
</style>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.5.0/dist/purify.min.js" defer></script>
  <script src="/assets/js/making-article.js" defer></script>
  <link rel="stylesheet" href="/assets/css/product-card.css">
<link rel="stylesheet" href="/assets/css/affiliate-disclosure.css">
<script src="/assets/js/affiliate-disclosure.js"></script>
<script src="/assets/js/rakuten-links.js"></script>
</head>
<body>
  <header>
    <a class="brand" href="/">走って、つくって。<small>RIDE &amp; MAKE / KANSAI</small></a>
    <nav aria-label="メインナビゲーション"><a href="/">トップ</a><a href="/making/">道具とものづくり</a><a href="/contact/">お問い合わせ</a>
<a href="https://www.youtube.com/channel/UCoxnBBcvXtO9DqRjDJId24w" target="_blank" rel="noopener noreferrer" aria-label="YouTube：Funky Maguro（新しいタブで開きます）">YouTube ↗</a>
</nav>
  </header>
  <main id="making-main" aria-busy="true">
    <p id="article-status" class="message" role="status">記事を読み込んでいます…</p>
    <article id="making-article" hidden>
      <div class="article-lead">
      <figure id="article-hero" class="hero" hidden>
        <img id="hero-image" alt="" fetchpriority="high">
        <figcaption id="hero-caption" hidden></figcaption>
      </figure>
      <div class="lead-copy">
      <div class="article-heading">
        <h1 id="article-title"></h1>
        <div id="article-category" class="eyebrow" hidden></div>
        <p class="date">公開 <time id="article-date"></time></p>
      </div>
      <p id="article-summary" class="summary" hidden></p>
      <a class="lead-read" href="#article-body">制作の記録を読む ↓</a>
      </div>
      </div>
      <section id="production-info" class="production" aria-labelledby="production-title" hidden>
        <h2 id="production-title">制作情報</h2>
        <dl id="production-data"></dl>
      </section>
      <div id="article-body" class="body"></div>
    </article>
    <noscript><p class="message">記事を表示するにはJavaScriptを有効にしてください。</p></noscript>
    <p class="back"><a href="/making/">← 制作記事一覧へ戻る</a></p>
  </main>
  <footer>走って、つくって。 © 2026　<a href="/privacy/">プライバシーポリシー</a> <a href="https://www.youtube.com/channel/UCoxnBBcvXtO9DqRjDJId24w" target="_blank" rel="noopener noreferrer" aria-label="YouTube：Funky Maguro（新しいタブで開きます）">YouTube ↗</a></footer>
</body>
</html>
