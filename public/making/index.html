<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>道具とものづくりの記事一覧｜走って、つくって。</title>
  <meta name="description" content="使って試した道具と、自分に合うものをつくる記録。道具とものづくりの記事を公開日の新しい順に紹介します。">
  <style>
    :root { --paper:#faf9f4; --ink:#20332f; --muted:#68736b; --line:#d8ddd1; --gold:#b39446; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif; line-height:1.9; }
    a { color:inherit; text-decoration:none; }
    a:focus-visible { outline:3px solid var(--gold); outline-offset:5px; }
    header { padding:23px 5%; display:flex; justify-content:space-between; align-items:center; gap:30px; border-bottom:1px solid var(--line); }
    .brand { font-size:24px; font-weight:800; letter-spacing:.06em; line-height:1.5; }
    .brand small { display:block; font-size:9px; letter-spacing:.25em; color:var(--muted); }
    nav { display:flex; flex-wrap:wrap; gap:12px 30px; font-size:12px; }
    nav a:hover,.card-link:hover { color:#927027; }
    .wrap { max-width:1160px; margin:auto; padding:65px 30px 90px; }
    .breadcrumb { font-size:11px; color:var(--muted); margin-bottom:24px; }
    .breadcrumb a { border-bottom:1px solid var(--line); }
    .eyebrow { font-size:10px; letter-spacing:.23em; font-weight:700; color:var(--gold); }
    h1,h2 { font-family:'Yu Mincho','Hiragino Mincho ProN',serif; font-weight:500; }
    h1 { font-size:clamp(30px,4vw,48px); line-height:1.5; margin:12px 0 20px; }
    .intro { max-width:620px; font-size:13px; color:var(--muted); margin-bottom:38px; }
    .making-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:24px; }
    .making-card { min-width:0; background:#eef0e7; display:flex; flex-direction:column; overflow-wrap:anywhere; transition:transform .2s,box-shadow .2s; }
    .making-card:hover { transform:translateY(-4px); box-shadow:0 8px 24px #20332f12; }
    .making-card-photo { display:block; background:#e6e8df; }
    .making-card-photo img { display:block; width:100%; height:auto; object-fit:contain; }
    .making-card-copy { display:flex; flex-direction:column; align-items:flex-start; padding:22px; flex:1; }
    .pill { font-size:10px; border:1px solid #a9b5a1; padding:3px 9px; letter-spacing:.08em; }
    .making-card h2 { font-size:23px; line-height:1.55; margin:13px 0 10px; white-space:pre-line; }
    .making-card p { color:#556359; font-size:12px; line-height:1.9; margin:0 0 18px; white-space:pre-line; }
    .card-meta { border-top:1px solid #d1d8c8; padding-top:12px; margin-top:auto; width:100%; color:var(--muted); font-size:10px; }
    .card-link { border-bottom:1px solid currentColor; font-size:11px; padding-bottom:3px; margin-top:18px; }
    .making-message { grid-column:1/-1; margin:0; padding:28px; background:#eef0e7; color:var(--muted); font-size:13px; }
    .back-link { display:inline-block; border-bottom:1px solid currentColor; font-size:12px; padding-bottom:5px; margin-top:40px; }
    footer { border-top:1px solid var(--line); padding:30px 5%; display:flex; justify-content:space-between; gap:25px; font-size:11px; color:var(--muted); }
    .footer-links { display:flex; flex-wrap:wrap; gap:18px 24px; }
    @media(max-width:900px) {
      nav { gap:12px 16px; font-size:11px; }
      .making-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
      .making-card-copy { padding:17px; }
      .making-card h2 { font-size:20px; }
    }
    @media(max-width:650px) {
      header { align-items:flex-start; flex-direction:column; padding:18px 22px; gap:16px; }
      .brand { font-size:22px; }
      nav { gap:10px 18px; font-size:10px; }
      nav a { white-space:nowrap; }
      .wrap { padding:45px 22px 65px; }
      .making-grid { grid-template-columns:1fr; gap:22px; }
      footer { flex-direction:column; padding:25px 22px; }
    }
    @media(prefers-reduced-motion:reduce) { .making-card { transition:none; } .making-card:hover { transform:none; } }

/* フッター項目の追加時も折り返せるようにする */
footer,.footer-links { flex-wrap:wrap; }

/* チャンネルリンクを追加しても既存ナビゲーションを折り返す。 */
header nav { flex-wrap:wrap; }
header nav a { white-space:nowrap; }
#article-body iframe[src*="youtube.com/embed/"], #article-body iframe[src*="youtube-nocookie.com/embed/"] { width:100%; height:auto; aspect-ratio:16/9; border:0; }
</style>
